# Builds installers for Windows, macOS and Linux when a version tag (v*) is pushed,
# and attaches them to a draft GitHub release for review before publishing.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Cloudflared Tunnel GUI ${{ github.ref_name }}'
          releaseBody: |
            Download the installer for your system from the assets below.

            - **Windows:** `.exe` (setup), `.msi`, or `_portable.zip` (no install, just unzip and run)
            - **macOS:** `.dmg` (`aarch64` for Apple Silicon, `x64` for Intel)
            - **Linux:** `.deb`, `.rpm` or `.AppImage`

            Requires the [cloudflared](https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/downloads/) CLI.
            The installers are not code-signed, so Windows SmartScreen and macOS Gatekeeper will warn on first launch.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # The release exe embeds the UI, so it runs without installing (needs WebView2, built into Windows 10/11)
      - name: Upload portable Windows build
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $zip = "Cloudflared.Tunnel.GUI_${version}_x64_portable.zip"
          Compress-Archive -Path src-tauri/target/release/cloudflared-tunnel-gui.exe -DestinationPath $zip
          gh release upload '${{ github.ref_name }}' $zip --clobber
